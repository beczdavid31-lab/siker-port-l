<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siker Portál - Belépés</title>
    <style>
        /* Modern, Vállalati Stílus (Siker Portál Design) */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #104a8e 0%, #00b4db 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        
        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            margin: 0;
            color: #104a8e;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .auth-header h2 span {
            font-weight: 300;
        }

        .auth-header p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        /* Űrlap elemek */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #104a8e;
            box-shadow: 0 0 0 3px rgba(16, 74, 142, 0.1);
        }

        /* Jelszó megjelenítő gomb (Szem ikon) */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 45px; /* Hely a gombnak */
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #666;
            outline: none;
            padding: 5px;
        }

        /* Gombok */
        .btn-submit {
            background-color: #104a8e;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0b3566;
            box-shadow: 0 4px 10px rgba(11, 53, 102, 0.3);
        }

        /* Váltás a nézetek között */
        .switch-view {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .switch-view a {
            color: #104a8e;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-view a:hover {
            text-decoration: underline;
        }

        /* Formák elrejtése */
        #registerForm {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <div id="loginForm">
            <div class="auth-header">
                <h2>Siker <span>Portál</span></h2>
                <p>Jelentkezz be a fiókodba</p>
            </div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>E-mail cím</label>
                    <input type="email" id="loginEmail" placeholder="pelda@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>Jelszó</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Titkos jelszavad" required>
                        <button type="button" class="toggle-password" onclick="toggleVisibility('loginPassword', this)">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" id="loginBtn">Belépés</button>
            </form>
            
            <div class="switch-view">
                Nincs még fiókod? <a onclick="switchView('register')">Regisztrálj itt!</a>
            </div>
        </div>


        <div id="registerForm">
            <div class="auth-header">
                <h2>Siker <span>Portál</span></h2>
                <p>Hozd létre a fiókodat</p>
            </div>
            
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Teljes Név</label>
                    <input type="text" id="regName" placeholder="Kovács János" required>
                </div>

                <div class="form-group">
                    <label>E-mail cím</label>
                    <input type="email" id="regEmail" placeholder="pelda@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>Jelszó (Válassz egy biztonságosat)</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="Minimum 6 karakter" required minlength="6">
                        <button type="button" class="toggle-password" onclick="toggleVisibility('regPassword', this)">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" id="regBtn" style="background-color: #2e7d32;">Regisztráció</button>
            </form>
            
            <div class="switch-view">
                Már van fiókod? <a onclick="switchView('login')">Lépj be itt!</a>
            </div>
        </div>

    </div>

    <script>
        // --- 1. JELSZÓ LÁTHATÓSÁG VÁLTÁSA ---
        function toggleVisibility(inputId, btnElement) {
            const inputField = document.getElementById(inputId);
            if (inputField.type === "password") {
                inputField.type = "text";
                btnElement.innerText = "🙈"; // Csukott szem ikon
            } else {
                inputField.type = "password";
                btnElement.innerText = "👁️"; // Nyitott szem ikon
            }
        }

        // --- 2. NÉZETEK KÖZÖTTI VÁLTÁS ---
        function switchView(view) {
            if (view === 'register') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            } else {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
            }
        }

        // --- 3. REGISZTRÁCIÓ KÜLDÉSE A MONGODB-NEK ---
        async function handleRegister(event) {
            event.preventDefault(); // Megakadályozza az oldal újratöltődését
            
            const btn = document.getElementById('regBtn');
            const originalText = btn.innerText;
            btn.innerText = "⏳ Regisztráció folyamatban...";
            btn.disabled = true;

            const payload = {
                name: document.getElementById('regName').value,
                username: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value
            };

            try {
                // A KULCS: Ide küldjük, és rárakjuk az 'application/json' fejléceket!
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    alert("✅ Sikeres regisztráció! Most már bejelentkezhetsz.");
                    switchView('login'); // Visszavisszük a belépéshez
                } else {
                    alert("❌ Hiba: " + (data.error || "A szerver elutasította a kérést."));
                }
            } catch (error) {
                alert("❌ Hálózati hiba! Nem érhető el a szerver.");
                console.error(error);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // --- 4. BEJELENTKEZÉS ÉS TOVÁBBÍTÁS A CRM-BE ---
        async function handleLogin(event) {
            event.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerText = "⏳ Belépés...";
            btn.disabled = true;

            const payload = {
                username: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // Ha a jelszó jó, elmentjük a kulcsot a böngésző memóriájába
                    localStorage.setItem('sikerPortalToken', data.token);
                    localStorage.setItem('sikerPortalUser', data.name);
                    
                    // Továbbítás a főoldalra (crm.html)
                    window.location.href = 'crm.html'; 
                } else {
                    alert("❌ Hiba: " + (data.error || "Hibás e-mail vagy jelszó!"));
                }
            } catch (error) {
                alert("❌ Hálózati hiba! Nem érhető el a szerver.");
                console.error(error);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
